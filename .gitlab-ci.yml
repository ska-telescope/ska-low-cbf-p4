# GitLab CI in conjunction with GitLab Runner can use Docker Engine to test and build any application.
# Docker, when used with GitLab CI, runs each job in a separate and isolated container using the predefined image that is set up in .gitlab-ci.yml.
# The default image comes from the `default:` block in the finaliser
# include below ($SKA_K8S_TOOLS_BUILD_DEPLOY) - a top-level `image:` key
# here would conflict with it ("image is defined in top-level and
# `default:` entry"), same as ska-low-cbf-conn's .gitlab-ci.yml.

# cache is used to specify a list of files and directories which should be cached between jobs. You can only use paths that are within the project workspace.
# If cache is defined outside the scope of jobs, it means it is set globally and all jobs will use that definition
# cache:
#   paths:
#     - build

# The YAML file defines a set of jobs with constraints stating when they should be run.
# You can specify an unlimited number of jobs which are defined as top-level elements with an arbitrary name and always have to contain at least the script clause.
# In this case we have only the test job which produce an artifacts (it must be placed into a directory called "public")
# It is also specified that only the master branch will be subject of this job.

stages:
  - lint
  - build
  - test
  - pages
  - publish
  - scan

#p4test:
#  stage: test
#  tags:
#    - p4testing
#  script:
#    - source ~/.profile
#    - poetry install
#    - sudo -E $(which poetry) run pytest -m bfrt -vv
#    - sudo chown -R gitlab-runner:gitlab-runner /home/gitlab-runner/builds/

# Previously no job here carried a merge_request_event rule, so the
# shared workflow rules (via the finaliser include) skip the branch
# pipeline once a branch has an open MR, and there was nothing else to
# run a merge request pipeline with instead - leaving no pipeline at
# all. This job unblocks that, and gives some of the black/isort
# coverage CLAUDE.md documents (not run in CI before). It skips the
# `pre-commit` framework itself: the pinned pre-commit-hooks rev
# (v2.3.0) no longer installs against current poetry-core from PyPI.
# allow_failure because the repo doesn't currently pass black/isort
# cleanly; tighten this once that's addressed.
format-check:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  before_script:
    - pip3 install --quiet black isort
  script:
    - black --check --line-length=79 --exclude '/\.make/' .
    - isort --check-only --profile black --line-length 79 --skip .make .

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # CHARTS_TO_PUBLISH: ska-low-cbf-p4 # no charts in this repo (yet?)
include:
  # Standard SKA includes:
  # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # .post step finalisers eg: badges
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'
